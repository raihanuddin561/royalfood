name: Run DB Migrations

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  migrate:
    name: Run migrations (CI)
    runs-on: ubuntu-latest
    env:
      # Provide your production DB connection via repository secrets
      DATABASE_URL_NEW: ${{ secrets.DATABASE_URL_NEW }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run DB migrations
        run: |
          echo "Running migrations..."
          npm run db:migrate:run

      - name: Post-migration verification
        run: |
          echo "Running post-migration verification"
          node ./scripts/post_migration_check.js

      - name: Build (optional validation)
        run: |
          echo "Building project to validate schema/runtime"
          npm run build

      - name: Success message
        if: success()
        run: echo "Migrations, verification and build completed successfully"

  deploy:
    name: Deploy (after migrations)
    runs-on: ubuntu-latest
    needs: migrate
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (if token provided)
        if: ${{ secrets.VERCEL_TOKEN && secrets.VERCEL_PROJECT_ID }}
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: --prod
          working-directory: .
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}

      - name: No-op deploy notice
        if: ${{ !secrets.VERCEL_TOKEN || !secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "VERCEL_TOKEN or VERCEL_PROJECT_ID not set. Skipping automatic Vercel deployment."
          echo "You can deploy manually or set the secrets to enable automatic deployment."
